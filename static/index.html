<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Cover Detector</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252540;--accent:#7c6af7;--accent2:#5dd4b4;--text:#e8e6f0;--muted:#9996b0;--danger:#f07070;--r:14px}
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:0 0 48px;-webkit-tap-highlight-color:transparent}
    header{width:100%;background:var(--surface);padding:18px 24px 14px;text-align:center;border-bottom:1px solid rgba(124,106,247,.2)}
    header h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
    header h1 span{color:var(--accent)}
    header p{font-size:13px;color:var(--muted);margin-top:3px}
    main{width:100%;max-width:480px;padding:20px 16px 0}
    #drop-zone{border:2px dashed rgba(124,106,247,.45);border-radius:var(--r);padding:36px 20px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s;position:relative}
    #drop-zone:hover,#drop-zone.drag-over{background:rgba(124,106,247,.08);border-color:var(--accent)}
    #drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .dz-icon{font-size:42px;line-height:1;display:block;margin-bottom:10px}
    .dz-title{font-size:16px;font-weight:600}.dz-sub{font-size:13px;color:var(--muted);margin-top:4px}
    #file-name{margin-top:10px;font-size:13px;color:var(--accent2);word-break:break-all;display:none}
    .divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:12px;color:var(--muted)}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}
    #btn-record{width:100%;padding:15px;background:var(--surface2);border:1.5px solid rgba(124,106,247,.3);border-radius:var(--r);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    #btn-record:hover{background:rgba(124,106,247,.15);border-color:var(--accent)}
    #btn-record.active{background:rgba(240,112,112,.15);border-color:var(--danger);color:var(--danger)}
    #btn-record .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);display:none}
    #btn-record.active .dot{display:block;animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    #timer{text-align:center;font-size:22px;font-weight:700;color:var(--danger);margin-top:8px;display:none}
    #btn-analyze{width:100%;margin-top:18px;padding:16px;background:var(--accent);border:none;border-radius:var(--r);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s;display:none}
    #btn-analyze:active{transform:scale(.98)}#btn-analyze:disabled{opacity:.5;cursor:not-allowed}
    #spinner{display:none;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
    .spin-ring{width:52px;height:52px;border:4px solid rgba(124,106,247,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #spinner p{font-size:14px;color:var(--muted)}
    #error-msg{display:none;margin-top:16px;padding:14px;background:rgba(240,112,112,.1);border:1px solid var(--danger);border-radius:var(--r);font-size:14px;color:var(--danger)}
    #results{margin-top:24px;display:none}
    #results h2{font-size:15px;color:var(--muted);margin-bottom:14px;font-weight:500}
    .rc{background:var(--surface2);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06)}
    .rc.top{border-color:rgba(93,212,180,.4);background:rgba(93,212,180,.06)}
    .rc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .rc-t{font-size:15px;font-weight:600;flex:1;margin-right:10px;line-height:1.3}
    .rc-b{font-size:18px;font-weight:800;white-space:nowrap;color:var(--accent2)}
    .bar-track{width:100%;height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s cubic-bezier(.22,.68,0,1.2);width:0%}
    .rc.top .bar-fill{background:linear-gradient(90deg,var(--accent2),#7cf7c4)}
    .rc-rank{font-size:11px;color:var(--muted);margin-top:6px}
    footer{margin-top:32px;font-size:12px;color:var(--muted);text-align:center;padding:0 16px}
  </style>
</head>
<body>
<header><h1>Cover <span>Detector</span></h1><p>Sube o graba un audio — encuentra a qué canción se parece</p></header>
<main>
  <div id="drop-zone"><input type="file" id="file-input" accept=".mp3,.wav,.ogg,.m4a,.flac">
    <span class="dz-icon">🎵</span><p class="dz-title">Sube tu audio</p>
    <p class="dz-sub">MP3, WAV, OGG, M4A o FLAC</p><p id="file-name"></p></div>
  <div class="divider">o</div>
  <button id="btn-record"><span class="dot"></span><span id="rec-label">🎤 Grabar desde el micrófono</span></button>
  <p id="timer">00:00</p>
  <button id="btn-analyze">Analizar 🔍</button>
  <div id="spinner"><div class="spin-ring"></div><p>Procesando espectrograma…</p></div>
  <div id="error-msg"></div>
  <div id="results"><h2 id="results-title"></h2><div id="results-list"></div></div>
</main>
<footer>Los resultados dependen de la calidad del audio y del dataset de entrenamiento.</footer>
<script>
const fi=document.getElementById("file-input"),dz=document.getElementById("drop-zone"),fn=document.getElementById("file-name"),
br=document.getElementById("btn-record"),rl=document.getElementById("rec-label"),ti=document.getElementById("timer"),
ba=document.getElementById("btn-analyze"),sp=document.getElementById("spinner"),em=document.getElementById("error-msg"),
rs=document.getElementById("results"),rl2=document.getElementById("results-list");
let af=null,mr=null,rc=[],ri=null,rs2=0,ir=false;
fi.addEventListener("change",e=>setFile(e.target.files[0]));
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag-over")});
dz.addEventListener("dragleave",()=>dz.classList.remove("drag-over"));
dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag-over");if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0])});
function setFile(f){af=f;fn.textContent=f.name;fn.style.display="block";ba.style.display="block";clear()}
br.addEventListener("click",async()=>{if(!ir)await startRec();else stopRec()});
async function startRec(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s,{mimeType:"audio/webm"});rc=[];rs2=0;mr.ondataavailable=e=>{if(e.data.size)rc.push(e.data)};mr.onstop=()=>{const b=new Blob(rc,{type:"audio/webm"});af=new File([b],"grabacion.webm",{type:"audio/webm"});fn.textContent="grabacion.webm ("+fmt(rs2)+")";fn.style.display="block";ba.style.display="block";s.getTracks().forEach(t=>t.stop())};mr.start(250);ir=true;br.classList.add("active");rl.textContent="⏹ Detener grabación";ti.style.display="block";ri=setInterval(()=>{rs2++;ti.textContent=fmt(rs2)},1000);clear()}catch(e){showErr("No se pudo acceder al micrófono: "+e.message)}}
function stopRec(){if(mr)mr.stop();clearInterval(ri);ir=false;br.classList.remove("active");rl.textContent="🎤 Grabar desde el micrófono";ti.style.display="none"}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
ba.addEventListener("click",async()=>{if(!af)return;if(ir)stopRec();clear();sp.style.display="flex";ba.disabled=true;try{const fd=new FormData();fd.append("audio",af);const r=await fetch("/analizar",{method:"POST",body:fd});if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||"Error del servidor")}const d=await r.json();render(d.resultados,d.archivo)}catch(e){showErr(e.message)}finally{sp.style.display="none";ba.disabled=false}});
function render(items,arch){rs.style.display="block";document.getElementById("results-title").textContent="Top "+items.length+" para '"+arch+"'";rl2.innerHTML="";items.forEach((it,i)=>{const c=document.createElement("div");c.className="rc"+(i===0?" top":"");const p=Math.min(100,Math.max(0,it.similitud));c.innerHTML="<div class='rc-h'><span class='rc-t'>"+esc(it.cancion)+"</span><span class='rc-b'>"+p.toFixed(1)+"%</span></div><div class='bar-track'><div class='bar-fill' data-p='"+p+"'></div></div><p class='rc-rank'>"+(i===0?"🏆 Mejor coincidencia":"#"+(i+1))+"</p>";rl2.appendChild(c)});requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar-fill").forEach(el=>el.style.width=el.dataset.p+"%")))}
function showErr(m){em.textContent="⚠ "+m;em.style.display="block"}
function clear(){rs.style.display="none";em.style.display="none";rl2.innerHTML=""}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
</script>
</body>
</html>
